<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<!-- ริชเมนู LINE แบบใหญ่ 2500x1686 แบ่ง 2x2 (ตรงกับเทมเพลต 4 ช่องใน LINE OA Manager) -->
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; }
  html, body { width:2500px; height:1686px; overflow:hidden; background:#16130e; }
  body { font-family:'Prompt','Sukhumvit Set','Thonburi',sans-serif; display:grid; grid-template-columns:1250px 1250px; grid-template-rows:843px 843px; }
  .tile { position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; padding:70px 80px; color:#fff; border:5px solid #16130e; }
  .photo { background-size:cover; }
  .photo::before { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 25%, rgba(10,8,5,.88) 88%); }
  .tile > * { position:relative; }
  .title { font-size:150px; font-weight:800; line-height:1.15; color:#ffc21c; text-shadow:0 6px 18px rgba(0,0,0,.55); }
  .sub { font-size:68px; font-weight:500; margin-top:14px; text-shadow:0 4px 12px rgba(0,0,0,.6); }
  .pill { position:absolute; top:60px; left:80px; background:#d62b1f; color:#fff; font-size:56px; font-weight:700; padding:10px 34px; border-radius:60px; }
  .burger { background-image:url(../assets/burger-charcoal.jpg); background-position:50% 72%; }
  .fish { background-image:url(../assets/fish-seabass.jpg); background-position:50% 45%; }
  .plain { justify-content:center; align-items:center; text-align:center; }
  .mine { background:#241f17; }
  .call { background:#ffc21c; color:#16130e; }
  .call .title { color:#16130e; text-shadow:none; }
  .call .sub { text-shadow:none; color:#3a2a00; }
  .icon { width:230px; height:230px; margin-bottom:30px; }
</style>
</head>
<body>
  <div class="tile photo burger">
    <span class="pill">กดสั่งเลย</span>
    <div class="title">สั่งเบอร์เกอร์</div>
    <div class="sub">รับหน้าร้าน / ให้ร้านไปส่ง</div>
  </div>

  <div class="tile photo fish">
    <span class="pill">ของสด</span>
    <div class="title">จองปลากระพง</div>
    <div class="sub">จองรอบส่ง · ส่งถึงบ้าน / มารับเอง</div>
  </div>

  <div class="tile plain mine">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#ffc21c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
      <rect x="9" y="3" width="6" height="4" rx="1.5"/>
      <path d="M9 12l2 2 4-4"/><path d="M9 17h6"/>
    </svg>
    <div class="title" style="font-size:130px">ออเดอร์ของฉัน</div>
    <div class="sub">เช็กสถานะ · ร้านรับแล้วหรือยัง</div>
  </div>

  <div class="tile plain call">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#16130e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>
    </svg>
    <div class="title" style="font-size:130px">โทรหาร้าน</div>
    <div class="sub">สอบถาม / สั่งทางโทรศัพท์</div>
  </div>
</body>
</html>
