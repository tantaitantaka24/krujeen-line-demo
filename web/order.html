<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สั่งเบอร์เกอร์ & จองปลา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1b16; --muted:#6b675d; --line:#e4e0d6; --brand:#ffb81c; --brand-ink:#3a2a00; --red:#d62b1f; --ok:#1e8a4c; --warn:#b26a00; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Prompt',system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:16px; }
  header { background:#16130e; color:#fff; padding:14px 16px 0; position:sticky; top:0; z-index:5; }
  header h1 { margin:0 0 10px; font-size:19px; font-weight:600; }
  header h1 span { color:var(--brand); }
  .tabs { display:flex; gap:4px; }
  .tabs button { flex:1; background:none; border:0; color:#cfc9bb; font:inherit; font-size:15px; padding:10px 4px; border-bottom:3px solid transparent; }
  .tabs button.on { color:#fff; border-color:var(--brand); }
  main { padding:12px 16px 120px; max-width:560px; margin:0 auto; }
  .demo { background:#fff6db; border:1px dashed var(--brand); border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:12px; }
  .demo input { margin-top:6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
  .item { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .item b { font-weight:500; }
  .price { color:var(--red); font-weight:600; white-space:nowrap; }
  .opts { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  .chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:6px 12px; margin:0 6px 6px 0; font-size:14px; background:#fff; }
  .chip.on { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }
  .stepper { display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .stepper button { width:38px; height:38px; border:0; background:#f1eee6; font-size:20px; }
  .stepper span { min-width:34px; text-align:center; }
  .btn { display:block; width:100%; border:0; border-radius:12px; padding:13px; font:inherit; font-weight:500; font-size:16px; background:var(--brand); color:var(--brand-ink); }
  .btn.ghost { background:#fff; border:1px solid var(--line); color:var(--ink); }
  .btn.small { display:inline-block; width:auto; padding:8px 14px; font-size:14px; }
  label.f { display:block; font-size:14px; color:var(--muted); margin:10px 0 4px; }
  input, textarea { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; padding:10px; border:1px solid var(--line); border-radius:10px; background:#fff; font:inherit; font-size:15px; }
  .seg button.on { background:#16130e; color:#fff; border-color:#16130e; }
  h2 { font-size:17px; font-weight:500; margin:18px 0 8px; }
  .muted { color:var(--muted); font-size:14px; }
  .err { color:var(--red); font-size:14px; margin-top:8px; }
  .cartline { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .cartline:last-child { border:0; }
  .x { border:0; background:none; color:var(--red); font-size:14px; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bar .in { max-width:560px; margin:0 auto; display:flex; gap:10px; align-items:center; }
  .bar .total { font-size:18px; font-weight:600; white-space:nowrap; }
  .badge { font-size:12px; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .s-pending { background:#fff1d6; color:var(--warn); } .s-confirmed { background:#e3f1ff; color:#0b5cad; }
  .s-ready { background:#e2f5e9; color:var(--ok); } .s-done { background:#eee; color:#555; } .s-rejected { background:#fde4e1; color:var(--red); }
  .progress { height:10px; background:#eee; border-radius:6px; overflow:hidden; margin:6px 0; }
  .progress div { height:100%; background:var(--brand); }
  .poster { width:100%; border-radius:12px; display:block; margin-bottom:8px; }
  .hide { display:none !important; }
  .done-box { text-align:center; padding:30px 10px; }
  .done-box .big { font-size:40px; }
</style>
</head>
<body>
<header>
  <h1 id="shopName"></h1>
  <nav class="tabs">
    <button data-tab="burger" class="on">🍔 เบอร์เกอร์</button>
    <button data-tab="fish">🐟 จองปลา</button>
    <button data-tab="mine">📋 ของฉัน</button>
  </nav>
</header>

<main>
  <div id="demoBox" class="demo hide">
    <b>โหมดเดโม</b> — ข้อมูลเก็บในเบราว์เซอร์นี้เท่านั้น ใส่ชื่อเพื่อจำลองว่าเป็นลูกค้าคนไหน
    <input id="demoName" placeholder="ชื่อลูกค้า เช่น คุณเอ">
  </div>
  <div id="closedBox" class="card hide" style="background:#fde4e1;border-color:#f3b8b1">ร้านปิดรับออเดอร์ชั่วคราว ขออภัยครับ</div>

  <section id="tab-burger">
    <div id="burgerList"></div>
    <details class="card"><summary class="muted">ดูรูปเมนู</summary>
      <img class="poster" src="../assets/menu-burgers.jpg" alt="เมนูเบอร์เกอร์">
      <img class="poster" src="../assets/menu-kebab.jpg" alt="เคบับเนื้อเบอร์เกอร์">
      <img class="poster" src="../assets/burger-charcoal.jpg" alt="เบอร์เกอร์ขนมปังชาโคล">
    </details>
  </section>

  <section id="tab-fish" class="hide">
    <div id="fishRound" class="card"></div>
    <div id="fishList"></div>
    <img class="poster" src="../assets/fish-seabass.jpg" alt="ปลากระพงสด">
  </section>

  <section id="checkout" class="hide">
    <h2>ตะกร้า</h2>
    <div class="card" id="cartBox"></div>

    <h2>รับของ</h2>
    <div class="seg" id="fulfilSeg">
      <button data-v="pickup" class="on">รับเอง</button>
      <button data-v="delivery">ให้ร้านไปส่ง</button>
    </div>
    <div id="timeBox">
      <label class="f">เวลาที่ต้องการ</label>
      <div class="seg" id="timeSeg"><button data-v="asap" class="on">เร็วที่สุด</button><button data-v="at">เลือกเวลา</button></div>
      <input id="timeAt" type="time" class="hide" style="margin-top:6px">
    </div>
    <label class="f">ชื่อ</label><input id="custName" autocomplete="name">
    <label class="f">เบอร์โทร <span id="phoneReq"></span></label><input id="phone" type="tel" inputmode="tel" autocomplete="tel">
    <div id="addrBox" class="hide"><label class="f">ที่อยู่จัดส่ง / จุดสังเกต</label><textarea id="address" rows="2"></textarea></div>
    <label class="f">หมายเหตุ</label><input id="note" placeholder="ไม่ใส่ผัก, ซอสแยก">

    <h2>จ่ายเงิน</h2>
    <div class="seg" id="paySeg">
      <button data-v="transfer" class="on">โอนเงิน</button>
      <button data-v="shop">จ่ายหน้าร้าน / ปลายทาง</button>
    </div>
    <div id="transferBox" class="card" style="margin-top:8px">
      <div class="muted">โอนพร้อมเพย์</div>
      <div><b id="ppId"></b> — <span id="ppName"></span></div>
      <label class="f">แนบสลิป</label>
      <input id="slip" type="file" accept="image/*">
      <img id="slipPreview" class="poster hide" style="max-width:160px;margin-top:8px" alt="สลิป">
    </div>
    <div id="shopNote" class="muted hide" style="margin-top:8px">ออเดอร์จะรอร้านยืนยันก่อน ร้านจะทักกลับในแชทถ้ามีคำถาม</div>
    <div id="payErr" class="err"></div>
  </section>

  <section id="tab-mine" class="hide"><div id="mineList"></div></section>

  <section id="doneBox" class="done-box hide"></section>
</main>

<div class="bar" id="bar">
  <div class="in">
    <div><div class="muted" id="barCount">ยังไม่ได้เลือก</div><div class="total" id="barTotal">0 ฿</div></div>
    <button class="btn" id="submitBtn" style="flex:1">สั่งเลย</button>
  </div>
  <div class="err" id="submitErr" style="text-align:center;max-width:560px;margin:4px auto 0"></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
const cfg = window.APP_CONFIG;
const $ = id => document.getElementById(id);
const STATUS = { pending:'รอร้านยืนยัน', confirmed:'ร้านรับแล้ว', ready:'พร้อมแล้ว', done:'เสร็จ', rejected:'ร้านไม่รับ', cancelled:'ยกเลิก' };
const state = { tab:'burger', carts:{ burger:[], fish:[] }, open:null, opts:{}, qty:1,
  fulfil:'pickup', time:'asap', pay:'transfer', slip:null, user:null, settings:null, customer:null, inLiff:false };

$('shopName').innerHTML = cfg.shopName.replace('ครูจีน', '<span>ครูจีน</span>');
$('ppId').textContent = cfg.promptPay.id; $('ppName').textContent = cfg.promptPay.name;

function baht(n) { return n.toLocaleString('th-TH') + ' ฿'; }
function cart() { return state.carts[state.tab === 'fish' ? 'fish' : 'burger']; }
function orderType() { return state.tab === 'fish' ? 'fish' : 'burger'; }

// ---------- ผู้ใช้ ----------
async function initUser() {
  if (cfg.liffId) {
    await liff.init({ liffId: cfg.liffId });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const p = await liff.getProfile();
    state.user = { key: p.userId, name: p.displayName };
    Store.setIdToken(liff.getIDToken());
    state.inLiff = liff.isInClient();
  } else {
    $('demoBox').classList.remove('hide');
    const saved = localStorage.getItem('demo_user') || '';
    $('demoName').value = saved;
    const setDemo = () => {
      const n = $('demoName').value.trim();
      localStorage.setItem('demo_user', n);
      state.user = n ? { key: 'demo:' + n, name: n } : null;
      if (n && !$('custName').value) $('custName').value = n;
      loadCustomer();
    };
    $('demoName').addEventListener('change', setDemo);
    setDemo();
  }
  if (state.user) { $('custName').value = state.user.name; if (cfg.liffId) loadCustomer(); }
}
async function loadCustomer() {
  state.customer = state.user ? await Store.getCustomer(state.user.key) : null;
  renderPay();
}

// ---------- เมนูเบอร์เกอร์ ----------
function renderBurgers() {
  $('burgerList').innerHTML = cfg.burgers.map(b => {
    const open = state.open === b.id;
    return `<div class="card">
      <div class="item" onclick="toggleItem('${b.id}')"><b>${b.name}</b><span class="price">${b.price} ฿</span></div>
      ${open ? `<div class="opts">
        ${cfg.burgerOptions.map(o => `<span class="chip ${state.opts[o.id] ? 'on' : ''}" onclick="toggleOpt('${o.id}')">${o.name} +${o.price}</span>`).join('')}
        <div class="item" style="margin-top:6px">
          <span class="stepper"><button onclick="stepQty(-1)">−</button><span>${state.qty}</span><button onclick="stepQty(1)">+</button></span>
          <button class="btn small" onclick="addBurger('${b.id}')">ใส่ตะกร้า ${baht(lineTotal(b))}</button>
        </div></div>` : ''}
    </div>`;
  }).join('');
}
function lineTotal(b) {
  return (b.price + cfg.burgerOptions.filter(o => state.opts[o.id]).reduce((s, o) => s + o.price, 0)) * state.qty;
}
function toggleItem(id) { state.open = state.open === id ? null : id; state.opts = {}; state.qty = 1; renderBurgers(); }
function toggleOpt(id) { state.opts[id] = !state.opts[id]; renderBurgers(); }
function stepQty(d) { state.qty = Math.max(1, state.qty + d); renderBurgers(); }
function addBurger(id) {
  const b = cfg.burgers.find(x => x.id === id);
  const options = cfg.burgerOptions.filter(o => state.opts[o.id]).map(o => ({ id: o.id, name: o.name, price: o.price }));
  const key = id + '|' + options.map(o => o.id).join(',');
  const ex = state.carts.burger.find(i => i.key === key);
  if (ex) ex.qty += state.qty;
  else state.carts.burger.push({ key, id, name: b.name, unitPrice: b.price, qty: state.qty, options });
  state.open = null; renderBurgers(); renderCart();
}

// ---------- ปลา ----------
function renderFish() {
  const s = state.settings, r = s && s.fishRound;
  if (!r) {
    $('fishRound').innerHTML = '<b>ยังไม่เปิดรอบจอง</b><div class="muted">ติดตามประกาศรอบถัดไปในแชทร้าน</div>';
    $('fishList').innerHTML = ''; return;
  }
  const left = Math.max(0, r.quota - s.fishBooked);
  const closed = r.closeAt && new Date() > new Date(r.closeAt);
  $('fishRound').innerHTML = `<b>รอบส่ง ${r.label}</b>
    <div class="muted">ปิดรับ ${r.closeAt ? new Date(r.closeAt).toLocaleString('th-TH', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '-'}</div>
    <div class="progress"><div style="width:${Math.min(100, s.fishBooked / r.quota * 100)}%"></div></div>
    <div class="muted">${closed ? 'ปิดรับจองแล้ว' : 'เหลือ ' + left + ' จาก ' + r.quota + ' ตัว'}</div>`;
  $('fishList').innerHTML = closed || !left ? '' : cfg.fishSizes.map(f => {
    const q = (state.carts.fish.find(i => i.id === f.id) || {}).qty || 0;
    return `<div class="card item"><div><b>${f.name}</b><div class="price">${f.price} ฿ / ตัว</div></div>
      <span class="stepper"><button onclick="stepFish('${f.id}',-1)">−</button><span>${q}</span><button onclick="stepFish('${f.id}',1)">+</button></span></div>`;
  }).join('');
}
function stepFish(id, d) {
  const f = cfg.fishSizes.find(x => x.id === id);
  let it = state.carts.fish.find(i => i.id === id);
  if (!it) { it = { key: id, id, name: f.name, unitPrice: f.price, qty: 0, options: [] }; state.carts.fish.push(it); }
  it.qty = Math.max(0, it.qty + d);
  state.carts.fish = state.carts.fish.filter(i => i.qty > 0);
  renderFish(); renderCart();
}

// ---------- ตะกร้า + checkout ----------
function currentOrder() {
  const items = cart().map(i => ({ id: i.id, name: i.name, unitPrice: i.unitPrice, qty: i.qty, options: i.options }));
  const o = { type: orderType(), channel: 'line', items, fulfil: state.fulfil, payment: state.pay,
    deliveryFee: state.fulfil === 'delivery' ? cfg.deliveryFee : 0 };
  o.total = Store.orderTotal(o);
  return o;
}
function renderCart() {
  const c = cart(), o = currentOrder();
  const show = (state.tab === 'burger' || state.tab === 'fish') && c.length;
  $('checkout').classList.toggle('hide', !show);
  $('cartBox').innerHTML = c.map((i, n) => `<div class="cartline">
    <div>${i.name}${i.options.length ? '<div class="muted">' + i.options.map(x => x.name).join(', ') + '</div>' : ''}</div>
    <div style="text-align:right;white-space:nowrap">x${i.qty} · ${baht(Store.itemPrice(i))}<br><button class="x" onclick="removeLine(${n})">ลบ</button></div></div>`).join('')
    + (o.deliveryFee ? `<div class="cartline"><div>ค่าส่ง</div><div>${baht(o.deliveryFee)}</div></div>` : '');
  const count = c.reduce((s, i) => s + i.qty, 0);
  $('barCount').textContent = count ? count + (state.tab === 'fish' ? ' ตัว' : ' ชิ้น') : 'ยังไม่ได้เลือก';
  $('barTotal').textContent = baht(o.total);
  $('timeBox').classList.toggle('hide', state.tab === 'fish');
  renderPay();
}
function removeLine(n) { cart().splice(n, 1); renderCart(); if (state.tab === 'fish') renderFish(); }

function seg(id, key, after) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state[key] = b.dataset.v;
    [...$(id).children].forEach(x => x.classList.toggle('on', x === b));
    after && after();
  });
}
seg('fulfilSeg', 'fulfil', () => { $('addrBox').classList.toggle('hide', state.fulfil !== 'delivery'); $('phoneReq').textContent = state.fulfil === 'delivery' ? '(จำเป็น)' : ''; renderCart(); });
seg('timeSeg', 'time', () => $('timeAt').classList.toggle('hide', state.time !== 'at'));
seg('paySeg', 'pay', renderPay);

function renderPay() {
  $('transferBox').classList.toggle('hide', state.pay !== 'transfer');
  $('shopNote').classList.toggle('hide', state.pay !== 'shop');
  const o = currentOrder();
  $('payErr').textContent = Store.payAtShopBlockedReason(o, state.customer);
}

$('slip').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  state.slip = await shrink(f);
  $('slipPreview').src = state.slip; $('slipPreview').classList.remove('hide');
});
function shrink(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    img.src = URL.createObjectURL(file);
  });
}

function orderText(o) {
  const lines = o.items.map(i => `• ${i.name}${i.options.length ? ' (' + i.options.map(x => x.name).join(', ') + ')' : ''} x${i.qty}`);
  const when = o.type === 'fish' ? 'รอบส่ง ' + (state.settings.fishRound || {}).label : (o.time === 'asap' ? 'เร็วที่สุด' : o.time);
  return `🧾 ออเดอร์ #${o.id}\n${lines.join('\n')}\nรวม ${o.total} บาท\n${o.fulfil === 'delivery' ? '🛵 ส่ง' : '🏠 รับเอง'} · ${when}\n${o.payment === 'transfer' ? '💸 โอนแล้ว (แนบสลิป)' : '💵 จ่ายหน้าร้าน/ปลายทาง'}`;
}

$('submitBtn').addEventListener('click', async () => {
  const err = $('submitErr'); err.textContent = '';
  if (state.tab === 'mine') { switchTab('burger'); return; }
  if (!state.user) { err.textContent = cfg.liffId ? 'กรุณาเข้าสู่ระบบ LINE' : 'ใส่ชื่อลูกค้าในกล่องโหมดเดโมก่อน'; window.scrollTo(0, 0); return; }
  const o = currentOrder();
  if (!o.items.length) { err.textContent = 'ยังไม่ได้เลือกเมนู'; return; }
  Object.assign(o, {
    customerKey: state.user.key, customerName: $('custName').value.trim() || state.user.name,
    phone: $('phone').value.trim(), address: $('address').value.trim(), note: $('note').value.trim(),
    time: state.tab === 'fish' ? '' : (state.time === 'at' ? $('timeAt').value : 'asap'),
    fishRoundId: o.type === 'fish' ? state.settings.fishRound.id : '', slip: state.pay === 'transfer' ? state.slip : null
  });
  if (o.payment === 'transfer' && !o.slip) { err.textContent = 'กรุณาแนบสลิป หรือเลือกจ่ายหน้าร้าน'; return; }
  if (o.fulfil === 'delivery' && (!o.phone || !o.address)) { err.textContent = 'กรุณาใส่เบอร์โทรและที่อยู่จัดส่ง'; return; }
  if (state.time === 'at' && o.type === 'burger' && !o.time) { err.textContent = 'กรุณาเลือกเวลา'; return; }
  $('submitBtn').disabled = true; $('submitBtn').textContent = 'กำลังส่ง…';
  try {
    const saved = await Store.createOrder(o);
    if (state.inLiff) { try { await liff.sendMessages([{ type: 'text', text: orderText(saved) }]); } catch (e) {} }
    state.carts[saved.type] = [];
    showDone(saved);
  } catch (e) { err.textContent = e.message; }
  $('submitBtn').disabled = false; $('submitBtn').textContent = 'สั่งเลย';
});

function showDone(o) {
  ['tab-burger', 'tab-fish', 'tab-mine', 'checkout'].forEach(id => $(id).classList.add('hide'));
  $('bar').classList.add('hide');
  $('doneBox').classList.remove('hide');
  $('doneBox').innerHTML = `<div class="big">${o.status === 'pending' ? '⏳' : '✅'}</div>
    <h2>ออเดอร์ #${o.id}</h2>
    <p><span class="badge s-${o.status}">${STATUS[o.status]}</span></p>
    <p class="muted">${o.status === 'pending' ? 'รอร้านกดยืนยันสักครู่ ดูสถานะได้ที่ "ออเดอร์ของฉัน"' : 'ร้านได้รับออเดอร์แล้ว ขอบคุณครับ'}</p>
    <p><b>${baht(o.total)}</b></p>
    <button class="btn ghost" onclick="switchTab('mine')">ดูออเดอร์ของฉัน</button>
    ${state.inLiff ? '<button class="btn" style="margin-top:8px" onclick="liff.closeWindow()">กลับไปที่แชท</button>' : ''}`;
}

// ---------- ออเดอร์ของฉัน ----------
async function renderMine() {
  if (!state.user) { $('mineList').innerHTML = '<p class="muted">ใส่ชื่อลูกค้าก่อน</p>'; return; }
  const list = await Store.myOrders(state.user.key);
  $('mineList').innerHTML = list.length ? list.map(o => `<div class="card">
    <div class="item"><b>#${o.id} · ${o.type === 'fish' ? 'ปลากระพง' : 'เบอร์เกอร์'}</b><span class="badge s-${o.status}">${STATUS[o.status]}</span></div>
    <div class="muted">${o.items.map(i => i.name + ' x' + i.qty).join(', ')}</div>
    <div class="item"><span class="muted">${new Date(o.createdAt).toLocaleString('th-TH', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}</span><span class="price">${baht(o.total)}</span></div>
  </div>`).join('') : '<p class="muted">ยังไม่มีออเดอร์</p>';
}

// ---------- แท็บ ----------
function switchTab(t) {
  state.tab = t;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  ['burger', 'fish', 'mine'].forEach(x => $('tab-' + x).classList.toggle('hide', x !== t));
  $('doneBox').classList.add('hide');
  $('bar').classList.toggle('hide', t === 'mine');
  if (t === 'mine') renderMine();
  if (t === 'fish') refreshSettings();
  renderCart();
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) switchTab(b.dataset.tab); });

async function refreshSettings() {
  state.settings = await Store.getSettings();
  $('closedBox').classList.toggle('hide', state.settings.accepting);
  renderFish();
}

(async function start() {
  await initUser();
  const t = new URLSearchParams(location.search).get('tab'); // อ่านหลัง liff.init เพราะ LIFF ส่ง query มาทีหลัง
  await refreshSettings();
  renderBurgers();
  switchTab(['burger', 'fish', 'mine'].includes(t) ? t : 'burger');
})();
</script>
</body>
