<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สั่งเบอร์เกอร์ & จองปลา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1b16; --muted:#6b675d; --line:#e7e2d6; --brand:#ffb81c; --brand-ink:#3a2a00; --dark:#16130e; --red:#d62b1f; --ok:#1e8a4c; --warn:#b26a00; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:'Prompt',system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:16px; }
  button { font:inherit; color:inherit; cursor:pointer; }
  header { background:var(--dark); color:#fff; padding:12px 16px 10px; position:sticky; top:0; z-index:10; }
  header h1 { margin:0 0 10px; font-size:18px; font-weight:600; display:flex; align-items:center; gap:8px; }
  header h1 span { color:var(--brand); }
  .tabs { display:flex; background:#2a251c; border-radius:12px; padding:3px; gap:3px; }
  .tabs button { flex:1; border:0; background:none; color:#cfc9bb; padding:9px 4px; border-radius:9px; font-size:15px; font-weight:500; }
  .tabs button.on { background:var(--brand); color:var(--brand-ink); }
  main { padding:14px 16px 130px; max-width:560px; margin:0 auto; }
  .demo { background:#fff6db; border:1px dashed var(--brand); border-radius:12px; padding:10px 12px; font-size:14px; margin-bottom:12px; }
  .demo input { margin-top:6px; }
  .banner { background:#fde4e1; border:1px solid #f3b8b1; color:var(--red); border-radius:12px; padding:10px 12px; margin-bottom:12px; font-size:15px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tile { position:relative; background:var(--card); border:0; border-radius:16px; overflow:hidden; padding:0; text-align:left; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .tile img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#eee; }
  .tile .t { padding:8px 10px 10px; }
  .tile .n { font-size:15px; font-weight:500; line-height:1.3; min-height:39px; padding-right:28px; }
  .tile .p { color:var(--red); font-weight:700; font-size:17px; margin-top:2px; }
  .tile .plus { position:absolute; right:8px; bottom:10px; width:34px; height:34px; border-radius:50%; background:var(--brand); color:var(--brand-ink); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:600; }
  .tile .qty { position:absolute; top:8px; right:8px; background:var(--dark); color:#fff; border-radius:999px; min-width:28px; height:28px; padding:0 8px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; }
  .card { background:var(--card); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .muted { color:var(--muted); font-size:14px; }
  .progress { height:10px; background:#eee; border-radius:6px; overflow:hidden; margin:8px 0 6px; }
  .progress div { height:100%; background:var(--brand); }
  .fish { display:flex; gap:12px; align-items:center; }
  .fish img { width:96px; height:72px; object-fit:cover; border-radius:12px; flex:none; }
  .fish .grow { flex:1; }
  .stepper { display:inline-flex; align-items:center; background:#f1eee6; border-radius:12px; }
  .stepper button { width:42px; height:42px; border:0; background:none; font-size:22px; font-weight:500; }
  .stepper span { min-width:26px; text-align:center; font-weight:600; }
  .skeleton { height:90px; border-radius:16px; background:linear-gradient(90deg,#eee,#f6f6f6,#eee); background-size:200% 100%; animation:sh 1.2s infinite; margin-bottom:12px; }
  @keyframes sh { to { background-position:-200% 0; } }

  /* แผงเลือกเมนู (bottom sheet) */
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:#fff; width:100%; max-width:560px; border-radius:20px 20px 0 0; max-height:92vh; overflow:auto; padding-bottom:calc(16px + env(safe-area-inset-bottom)); animation:up .18s ease-out; }
  @keyframes up { from { transform:translateY(40px); opacity:.6; } }
  .sheet img.hero { width:100%; aspect-ratio:16/10; object-fit:cover; display:block; }
  .sheet .body { padding:14px 16px 0; }
  .sheet h3 { margin:0; font-size:20px; font-weight:600; }
  .opts { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0 14px; }
  .opt { border:2px solid var(--line); background:#fff; border-radius:14px; padding:0 0 6px; overflow:hidden; text-align:center; position:relative; }
  .opt img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; }
  .opt .on-mark { display:none; position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:var(--ok); color:#fff; font-size:14px; line-height:22px; }
  .opt.on { border-color:var(--ok); background:#f0faf3; }
  .opt.on .on-mark { display:block; }
  .opt div { font-size:13px; line-height:1.25; padding:5px 4px 0; }
  .opt b { font-size:13px; color:var(--red); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .btn { display:block; width:100%; border:0; border-radius:14px; padding:14px; font-weight:600; font-size:17px; background:var(--brand); color:var(--brand-ink); }
  .btn:disabled { opacity:.6; }
  .btn.ghost { background:#fff; border:1px solid var(--line); color:var(--ink); font-weight:500; }
  .x-close { z-index:2; position:absolute; top:10px; right:10px; width:36px; height:36px; border-radius:50%; border:0; background:rgba(0,0,0,.55); color:#fff; font-size:20px; }

  /* ตะกร้า / checkout */
  h2 { font-size:17px; font-weight:600; margin:18px 0 8px; }
  .cl { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .cl:last-child { border:0; }
  .cl img { width:56px; height:42px; object-fit:cover; border-radius:8px; flex:none; }
  .cl .grow { flex:1; min-width:0; font-size:15px; }
  .seg { display:flex; gap:8px; }
  .seg button { flex:1; padding:12px 6px; border:2px solid var(--line); border-radius:12px; background:#fff; font-size:15px; font-weight:500; }
  .seg button.on { border-color:var(--dark); background:var(--dark); color:#fff; }
  label.f { display:block; font-size:14px; color:var(--muted); margin:12px 0 4px; }
  input, textarea { width:100%; font:inherit; padding:12px; border:1px solid var(--line); border-radius:12px; background:#fff; }
  .err { color:var(--red); font-size:14px; margin-top:8px; }
  .back { border:0; background:none; color:var(--muted); padding:0; font-size:15px; margin-bottom:4px; }

  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); z-index:20; }
  .bar .in { max-width:560px; margin:0 auto; display:flex; gap:12px; align-items:center; }
  .bar .total { font-size:19px; font-weight:700; white-space:nowrap; }
  .badge { font-size:12px; padding:3px 10px; border-radius:999px; white-space:nowrap; font-weight:500; }
  .s-pending { background:#fff1d6; color:var(--warn); } .s-confirmed { background:#e3f1ff; color:#0b5cad; }
  .s-ready { background:#e2f5e9; color:var(--ok); } .s-done { background:#eee; color:#555; } .s-rejected { background:#fde4e1; color:var(--red); }
  .done-box { text-align:center; padding:30px 10px; }
  .done-box .big { font-size:52px; }
  .hide { display:none !important; }
</style>
</head>
<body>
<header>
  <h1 id="shopName"></h1>
  <nav class="tabs">
    <button data-tab="burger" class="on">🍔 เบอร์เกอร์</button>
    <button data-tab="fish">🐟 จองปลา</button>
    <button data-tab="mine">📋 ของฉัน</button>
  </nav>
</header>

<main>
  <div id="demoBox" class="demo hide">
    <b>โหมดเดโม</b> — ข้อมูลเก็บในเบราว์เซอร์นี้เท่านั้น ใส่ชื่อเพื่อจำลองลูกค้า
    <input id="demoName" placeholder="ชื่อลูกค้า เช่น คุณเอ">
  </div>
  <div id="closedBox" class="banner hide">ร้านปิดรับออเดอร์ชั่วคราว ขออภัยครับ</div>

  <section id="v-burger"><div class="grid" id="burgerGrid"></div></section>

  <section id="v-fish" class="hide">
    <div id="fishRound"><div class="skeleton"></div></div>
    <div id="fishList"></div>
  </section>

  <section id="v-checkout" class="hide">
    <button class="back" onclick="showMenu()">‹ กลับไปเลือกเมนู</button>
    <div class="card" id="cartBox"></div>

    <h2>รับของ</h2>
    <div class="seg" id="fulfilSeg"><button data-v="pickup" class="on">🏠 รับเอง</button><button data-v="delivery">🛵 ให้ร้านไปส่ง</button></div>
    <div id="timeBox">
      <label class="f">เวลาที่ต้องการ</label>
      <div class="seg" id="timeSeg"><button data-v="asap" class="on">เร็วที่สุด</button><button data-v="at">เลือกเวลา</button></div>
      <input id="timeAt" type="time" class="hide" style="margin-top:8px">
    </div>
    <label class="f">ชื่อ</label><input id="custName" autocomplete="name">
    <label class="f">เบอร์โทร <span id="phoneReq"></span></label><input id="phone" type="tel" inputmode="tel" autocomplete="tel">
    <div id="addrBox" class="hide"><label class="f">ที่อยู่จัดส่ง / จุดสังเกต</label><textarea id="address" rows="2"></textarea></div>
    <label class="f">หมายเหตุ</label><input id="note" placeholder="ไม่ใส่ผัก, ซอสแยก">

    <h2>จ่ายเงิน</h2>
    <div class="seg" id="paySeg"><button data-v="transfer" class="on">💸 โอนเงิน</button><button data-v="shop">💵 จ่ายหน้าร้าน</button></div>
    <div id="transferBox" class="card" style="margin-top:10px">
      <div class="muted">โอนพร้อมเพย์</div>
      <div style="font-size:18px"><b id="ppId"></b></div>
      <div class="muted" id="ppName"></div>
      <label class="f">แนบสลิป</label>
      <input id="slip" type="file" accept="image/*">
      <img id="slipPreview" class="hide" style="max-width:140px;border-radius:10px;margin-top:8px" alt="สลิป">
    </div>
    <div id="shopNote" class="muted hide" style="margin-top:8px">ออเดอร์จะรอร้านยืนยันก่อน ร้านอาจทักกลับในแชท</div>
    <div id="payErr" class="err"></div>
  </section>

  <section id="v-mine" class="hide"><div id="mineList"></div></section>
  <section id="v-done" class="done-box hide"></section>
</main>

<div class="bar" id="bar">
  <div class="in">
    <div><div class="muted" id="barCount">ยังไม่ได้เลือก</div><div class="total" id="barTotal">0 ฿</div></div>
    <button class="btn" id="barBtn" style="flex:1">ถัดไป ›</button>
  </div>
  <div class="err" id="submitErr" style="text-align:center;max-width:560px;margin:4px auto 0"></div>
</div>

<div id="sheet" class="sheet-bg hide"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
const cfg = window.APP_CONFIG;
const $ = id => document.getElementById(id);
const IMG = f => cfg.imgBase + f;
const STATUS = { pending:'รอร้านยืนยัน', confirmed:'ร้านรับแล้ว', ready:'พร้อมแล้ว', done:'เสร็จ', rejected:'ร้านไม่รับ', cancelled:'ยกเลิก' };
const state = { tab:'burger', view:'menu', carts:{ burger:[], fish:[] }, pick:null,
  fulfil:'pickup', time:'asap', pay:'transfer', slip:null, user:null, settings:null, customer:null, inLiff:false };

$('shopName').innerHTML = '🍔 ' + cfg.shopName.replace('ครูจีน', '<span>ครูจีน</span>');
$('ppId').textContent = cfg.promptPay.id; $('ppName').textContent = cfg.promptPay.name;

const baht = n => n.toLocaleString('th-TH') + ' ฿';
const type = () => state.tab === 'fish' ? 'fish' : 'burger';
const cart = () => state.carts[type()];
const imgOf = id => IMG((cfg.burgers.concat(Store.fishSizes(state.settings && state.settings.fishRound)).find(x => x.id === id) || {}).img || '');

// ---------- เมนูเบอร์เกอร์: แสดงทันทีจาก config ไม่ต้องรอเน็ต ----------
function renderBurgers() {
  $('burgerGrid').innerHTML = cfg.burgers.map((b, i) => {
    const q = state.carts.burger.filter(x => x.id === b.id).reduce((s, x) => s + x.qty, 0);
    return `<button class="tile" onclick="openPick('${b.id}')">
      <img src="${IMG(b.img)}" alt="${b.name}" ${i > 3 ? 'loading="lazy"' : ''}>
      ${q ? `<span class="qty">${q}</span>` : ''}
      <div class="t"><div class="n">${b.name}</div><div class="p">${b.price} ฿</div></div>
      <span class="plus">+</span>
    </button>`;
  }).join('');
}

function openPick(id) {
  state.pick = { id, opts: {}, qty: 1 };
  renderPick();
  $('sheet').classList.remove('hide');
}
function closePick() { $('sheet').classList.add('hide'); state.pick = null; }
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closePick(); });
function pickTotal() {
  const b = cfg.burgers.find(x => x.id === state.pick.id);
  return (b.price + cfg.burgerOptions.filter(o => state.pick.opts[o.id]).reduce((s, o) => s + o.price, 0)) * state.pick.qty;
}
function renderPick() {
  const b = cfg.burgers.find(x => x.id === state.pick.id);
  $('sheet').innerHTML = `<div class="sheet" style="position:relative">
    <button class="x-close" onclick="closePick()" aria-label="ปิด">×</button>
    <img class="hero" src="${IMG(b.img)}" alt="${b.name}">
    <div class="body">
      <div class="row"><h3>${b.name}</h3><span style="color:var(--red);font-weight:700;font-size:20px">${b.price} ฿</span></div>
      <div class="muted" style="margin-top:10px">เพิ่มความอร่อย (เลือกได้หลายอย่าง)</div>
      <div class="opts">${cfg.burgerOptions.map(o => `<button class="opt" id="opt-${o.id}" onclick="togglePickOpt('${o.id}')">
        <span class="on-mark">✓</span><img src="${IMG(o.img)}" alt=""><div>${o.name}<br><b>+${o.price}</b></div></button>`).join('')}</div>
      <div class="row" style="margin-bottom:14px">
        <span class="muted">จำนวน</span>
        <span class="stepper"><button onclick="stepPick(-1)" aria-label="ลด">−</button><span id="pickQty">1</span><button onclick="stepPick(1)" aria-label="เพิ่ม">+</button></span>
      </div>
      <button class="btn" id="pickAdd" onclick="addPick()">ใส่ตะกร้า · ${baht(pickTotal())}</button>
    </div></div>`;
}
// อัปเดตเฉพาะจุด ไม่สร้างแผงใหม่ (กันจอกระพริบ)
function updatePick() {
  cfg.burgerOptions.forEach(o => $('opt-' + o.id).classList.toggle('on', !!state.pick.opts[o.id]));
  $('pickQty').textContent = state.pick.qty;
  $('pickAdd').textContent = 'ใส่ตะกร้า · ' + baht(pickTotal());
}
function togglePickOpt(id) { state.pick.opts[id] = !state.pick.opts[id]; updatePick(); }
function stepPick(d) { state.pick.qty = Math.max(1, state.pick.qty + d); updatePick(); }
function addPick() {
  const b = cfg.burgers.find(x => x.id === state.pick.id);
  const options = cfg.burgerOptions.filter(o => state.pick.opts[o.id]).map(o => ({ id: o.id, name: o.name, price: o.price }));
  const key = b.id + '|' + options.map(o => o.id).join(',');
  const ex = state.carts.burger.find(i => i.key === key);
  if (ex) ex.qty += state.pick.qty;
  else state.carts.burger.push({ key, id: b.id, name: b.name, unitPrice: b.price, qty: state.pick.qty, options });
  closePick(); renderBurgers(); renderBar();
}

// ---------- ปลา ----------
function renderFish() {
  const s = state.settings;
  if (!s) return; // ยังโหลดอยู่ (แสดง skeleton)
  const r = s.fishRound;
  if (!r) {
    $('fishRound').innerHTML = '<div class="card"><b>ยังไม่เปิดรอบจอง</b><div class="muted">ติดตามประกาศรอบถัดไปในแชทร้าน</div></div>';
    $('fishList').innerHTML = ''; return;
  }
  const left = Math.max(0, r.quota - s.fishBooked);
  const closed = r.closeAt && new Date() > new Date(r.closeAt);
  $('fishRound').innerHTML = `<div class="card"><div class="row"><b>🚚 รอบส่ง ${r.label}</b><span class="badge ${closed || !left ? 's-rejected' : 's-ready'}">${closed ? 'ปิดรับแล้ว' : left ? 'เหลือ ' + left + ' ตัว' : 'เต็มแล้ว'}</span></div>
    <div class="progress"><div style="width:${Math.min(100, s.fishBooked / r.quota * 100)}%"></div></div>
    <div class="muted">จองแล้ว ${s.fishBooked}/${r.quota} ตัว${r.closeAt ? ' · ปิดรับ ' + new Date(r.closeAt).toLocaleString('th-TH', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : ''}</div></div>`;
  $('fishList').innerHTML = closed || !left ? '' : Store.fishSizes(r).map(f => {
    const q = (state.carts.fish.find(i => i.id === f.id) || {}).qty || 0, sizeLeft = fishSizeLeft(f);
    return `<div class="card fish"><img src="${IMG(f.img)}" alt="${f.name}">
      <div class="grow"><b>${f.name}</b><div style="color:var(--red);font-weight:700">${f.price} ฿ / ตัว</div>
        ${f.quota ? `<div class="muted">${sizeLeft ? 'เหลือ ' + sizeLeft + ' ตัว' : 'ไซซ์นี้หมดแล้ว'}</div>` : ''}</div>
      ${sizeLeft ? `<span class="stepper"><button onclick="stepFish('${f.id}',-1)" aria-label="ลด">−</button><span>${q}</span><button onclick="stepFish('${f.id}',1)" aria-label="เพิ่ม">+</button></span>` : ''}</div>`;
  }).join('');
}
// จำนวนที่ยังจองได้ของไซซ์นี้ (รอบที่ไม่ได้แยกจำนวนตามไซซ์ = ไม่จำกัดรายไซซ์)
function fishSizeLeft(f) {
  return f.quota ? Math.max(0, f.quota - ((state.settings.fishBookedBySize || {})[f.id] || 0)) : Infinity;
}
function stepFish(id, d) {
  const f = Store.fishSizes(state.settings.fishRound).find(x => x.id === id);
  let it = state.carts.fish.find(i => i.id === id);
  if (!it) { it = { key: id, id, name: f.name, unitPrice: f.price, qty: 0, options: [] }; state.carts.fish.push(it); }
  it.qty = Math.min(fishSizeLeft(f), Math.max(0, it.qty + d));
  state.carts.fish = state.carts.fish.filter(i => i.qty > 0);
  renderFish(); renderBar();
}

// ---------- แถบล่าง + checkout ----------
function currentOrder() {
  const items = cart().map(i => ({ id: i.id, name: i.name, unitPrice: i.unitPrice, qty: i.qty, options: i.options }));
  const o = { type: type(), channel: 'line', items, fulfil: state.fulfil, payment: state.pay,
    deliveryFee: state.fulfil === 'delivery' ? cfg.deliveryFee : 0 };
  o.total = Store.orderTotal(o);
  return o;
}
function renderBar() {
  const c = cart(), o = currentOrder(), n = c.reduce((s, i) => s + i.qty, 0);
  $('bar').classList.toggle('hide', state.tab === 'mine' || state.view === 'done');
  $('barCount').textContent = n ? 'ตะกร้า ' + n + (type() === 'fish' ? ' ตัว' : ' ชิ้น') : 'ยังไม่ได้เลือก';
  $('barTotal').textContent = baht(o.total);
  $('barBtn').textContent = state.view === 'checkout' ? 'ยืนยันสั่ง' : 'ถัดไป ›';
  $('barBtn').disabled = !n;
  if (state.view === 'checkout') renderCheckout();
}
function renderCheckout() {
  const c = cart(), o = currentOrder();
  $('cartBox').innerHTML = c.map((i, n) => `<div class="cl"><img src="${imgOf(i.id)}" alt="">
    <div class="grow">${i.name}${i.options.length ? '<div class="muted">+ ' + i.options.map(x => x.name).join(', ') + '</div>' : ''}</div>
    <div style="text-align:right;white-space:nowrap">x${i.qty}<br><b>${baht(Store.itemPrice(i))}</b></div>
    <button class="back" style="color:var(--red);margin:0 0 0 4px" onclick="removeLine(${n})" aria-label="ลบ">✕</button></div>`).join('')
    + (o.deliveryFee ? `<div class="cl"><div class="grow">ค่าส่ง</div><b>${baht(o.deliveryFee)}</b></div>` : '');
  $('timeBox').classList.toggle('hide', type() === 'fish');
  renderPay();
}
function removeLine(n) {
  cart().splice(n, 1);
  if (!cart().length) showMenu(); else renderBar();
  renderBurgers(); renderFish();
}
function showCheckout() {
  state.view = 'checkout';
  ['v-burger', 'v-fish'].forEach(id => $(id).classList.add('hide'));
  $('v-checkout').classList.remove('hide');
  window.scrollTo(0, 0); renderBar();
}
function showMenu() {
  state.view = 'menu';
  $('v-checkout').classList.add('hide');
  $('v-' + state.tab).classList.remove('hide');
  $('submitErr').textContent = '';
  renderBar();
}

function seg(id, key, after) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state[key] = b.dataset.v;
    [...$(id).children].forEach(x => x.classList.toggle('on', x === b));
    after && after();
  });
}
seg('fulfilSeg', 'fulfil', () => { $('addrBox').classList.toggle('hide', state.fulfil !== 'delivery'); $('phoneReq').textContent = state.fulfil === 'delivery' ? '(จำเป็น)' : ''; renderBar(); });
seg('timeSeg', 'time', () => $('timeAt').classList.toggle('hide', state.time !== 'at'));
seg('paySeg', 'pay', renderPay);
function renderPay() {
  $('transferBox').classList.toggle('hide', state.pay !== 'transfer');
  $('shopNote').classList.toggle('hide', state.pay !== 'shop');
  $('payErr').textContent = Store.payAtShopBlockedReason(currentOrder(), state.customer);
}

$('slip').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  state.slip = await shrink(f);
  $('slipPreview').src = state.slip; $('slipPreview').classList.remove('hide');
});
function shrink(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    img.src = URL.createObjectURL(file);
  });
}

function orderText(o) {
  const lines = o.items.map(i => `• ${i.name}${i.options.length ? ' (' + i.options.map(x => x.name).join(', ') + ')' : ''} x${i.qty}`);
  const when = o.type === 'fish' ? 'รอบส่ง ' + (state.settings.fishRound || {}).label : (o.time === 'asap' ? 'เร็วที่สุด' : o.time);
  return `🧾 ออเดอร์ #${o.id}\n${lines.join('\n')}\nรวม ${o.total} บาท\n${o.fulfil === 'delivery' ? '🛵 ส่ง' : '🏠 รับเอง'} · ${when}\n${o.payment === 'transfer' ? '💸 โอนแล้ว (แนบสลิป)' : '💵 จ่ายหน้าร้าน/ปลายทาง'}`;
}

$('barBtn').addEventListener('click', () => state.view === 'checkout' ? submit() : showCheckout());

async function submit() {
  const err = $('submitErr'); err.textContent = '';
  if (!state.user) { err.textContent = cfg.liffId ? 'กำลังเชื่อมต่อ LINE ลองอีกครั้ง' : 'ใส่ชื่อลูกค้าในกล่องโหมดเดโมก่อน'; return; }
  if (type() === 'fish' && !(state.settings && state.settings.fishRound)) { err.textContent = 'ยังไม่เปิดรอบจองปลา'; return; }
  const o = currentOrder();
  Object.assign(o, {
    customerKey: state.user.key, customerName: $('custName').value.trim() || state.user.name,
    phone: $('phone').value.trim(), address: $('address').value.trim(), note: $('note').value.trim(),
    time: o.type === 'fish' ? '' : (state.time === 'at' ? $('timeAt').value : 'asap'),
    fishRoundId: o.type === 'fish' ? state.settings.fishRound.id : '', slip: state.pay === 'transfer' ? state.slip : null
  });
  if (o.payment === 'transfer' && !o.slip) { err.textContent = 'แนบสลิป หรือเลือกจ่ายหน้าร้าน'; return; }
  if (o.fulfil === 'delivery' && (!o.phone || !o.address)) { err.textContent = 'ใส่เบอร์โทรและที่อยู่จัดส่ง'; return; }
  if (state.time === 'at' && o.type === 'burger' && !o.time) { err.textContent = 'เลือกเวลา'; return; }
  const blocked = Store.payAtShopBlockedReason(o, state.customer);
  if (blocked) { err.textContent = blocked; return; }
  $('barBtn').disabled = true; $('barBtn').textContent = 'กำลังส่ง…';
  try {
    const saved = await Store.createOrder(o);
    if (state.inLiff) { try { await liff.sendMessages([{ type: 'text', text: orderText(saved) }]); } catch (e) {} }
    state.carts[saved.type] = [];
    showDone(saved);
  } catch (e) { err.textContent = e.message; renderBar(); }
}

function showDone(o) {
  state.view = 'done';
  ['v-burger', 'v-fish', 'v-mine', 'v-checkout'].forEach(id => $(id).classList.add('hide'));
  $('v-done').classList.remove('hide');
  renderBar(); renderBurgers();
  $('v-done').innerHTML = `<div class="big">${o.status === 'pending' ? '⏳' : '✅'}</div>
    <h2 style="font-size:22px">ออเดอร์ #${o.id}</h2>
    <p><span class="badge s-${o.status}">${STATUS[o.status]}</span></p>
    <p class="muted">${o.status === 'pending' ? 'รอร้านกดยืนยันสักครู่ ดูสถานะได้ที่แท็บ "ของฉัน"' : 'ร้านได้รับออเดอร์แล้ว ขอบคุณครับ'}</p>
    <p style="font-size:20px"><b>${baht(o.total)}</b></p>
    ${state.inLiff ? '<button class="btn" onclick="liff.closeWindow()">กลับไปที่แชท</button>' : ''}
    <button class="btn ghost" style="margin-top:8px" onclick="switchTab('mine')">ดูออเดอร์ของฉัน</button>`;
}

// ---------- ออเดอร์ของฉัน ----------
async function renderMine() {
  if (!state.user) { $('mineList').innerHTML = '<p class="muted">กำลังเชื่อมต่อ…</p>'; return; }
  $('mineList').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
  const list = await Store.myOrders(state.user.key);
  $('mineList').innerHTML = list.length ? list.map(o => `<div class="card">
    <div class="row"><b>#${o.id} ${o.type === 'fish' ? '🐟' : '🍔'}</b><span class="badge s-${o.status}">${STATUS[o.status]}</span></div>
    <div class="muted" style="margin:4px 0">${o.items.map(i => i.name + ' x' + i.qty).join(', ')}</div>
    <div class="row"><span class="muted">${new Date(o.createdAt).toLocaleString('th-TH', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}</span><b style="color:var(--red)">${baht(o.total)}</b></div>
  </div>`).join('') : '<p class="muted">ยังไม่มีออเดอร์</p>';
}

// ---------- แท็บ ----------
function switchTab(t) {
  state.tab = t; state.view = 'menu';
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  ['burger', 'fish', 'mine', 'checkout', 'done'].forEach(x => $('v-' + x).classList.toggle('hide', x !== t));
  $('submitErr').textContent = '';
  if (t === 'mine') renderMine();
  if (t === 'fish') renderFish();
  renderBar();
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) switchTab(b.dataset.tab); });

// ---------- เริ่ม: แสดงเมนูก่อน แล้วค่อยเชื่อม LINE/หลังบ้านเบื้องหลัง ----------
function applySettings(s) {
  state.settings = s;
  if (!Store.DEMO) try { localStorage.setItem('last_settings', JSON.stringify(s)); } catch (e) {}
  $('closedBox').classList.toggle('hide', s.accepting);
  renderFish(); if (state.view === 'checkout') renderPay();
}
function applyInit(r) {
  state.initDone = true; state.customer = r.customer;
  applySettings(r.settings);
}
async function connect() {
  if (cfg.liffId) {
    await liff.init({ liffId: cfg.liffId });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    state.inLiff = liff.isInClient();
    const p = await liff.getProfile();
    state.user = { key: p.userId, name: p.displayName };
    Store.setIdToken(liff.getIDToken());
    $('custName').value = p.displayName;
    const t = new URLSearchParams(location.search).get('tab'); // LIFF ส่ง query มาหลัง init
    if (t && t !== state.tab && ['fish', 'mine'].includes(t)) switchTab(t);
    else if (state.tab === 'mine') renderMine();
    applyInit(await Store.init());
  } else {
    $('demoBox').classList.remove('hide');
    const setDemo = async () => {
      const n = $('demoName').value.trim();
      localStorage.setItem('demo_user', n);
      state.user = n ? { key: 'demo:' + n, name: n } : null;
      if (n) $('custName').value = n;
      applyInit(await Store.init(state.user && state.user.key));
      if (state.tab === 'mine') renderMine();
    };
    $('demoName').value = localStorage.getItem('demo_user') || '';
    $('demoName').addEventListener('change', setDemo);
    await setDemo();
  }
}

renderBurgers();
const t0 = new URLSearchParams(location.search).get('tab');
switchTab(['burger', 'fish', 'mine'].includes(t0) ? t0 : 'burger');
// รอบปลา: แสดงค่าจากครั้งก่อนทันที แล้วขอค่าล่าสุดจากหลังบ้านพร้อมกับเชื่อม LINE (ไม่ต้องรอ LINE เสร็จก่อน)
if (!Store.DEMO) {
  try { const s = JSON.parse(localStorage.getItem('last_settings')); if (s) applySettings(s); } catch (e) {}
  Store.getSettings().then(s => { if (!state.initDone) applySettings(s); }).catch(() => {});
}
connect().catch(e => { $('submitErr').textContent = 'เชื่อมต่อไม่สำเร็จ: ' + e.message; });
</script>
</body>
